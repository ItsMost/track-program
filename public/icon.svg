<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Track Lanes Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Speed Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Stylized Running Track Oval -->
  <path d="M 120 160 
           L 392 160 
           A 96 96 0 0 1 392 352 
           L 120 352 
           A 96 96 0 0 1 120 160 Z" 
        fill="none" 
        stroke="url(#trackGrad)" 
        stroke-width="32" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
  />

  <path d="M 150 190 
           L 362 190 
           A 66 66 0 0 1 362 322 
           L 150 322 
           A 66 66 0 0 1 150 190 Z" 
        fill="none" 
        stroke="#f8fafc" 
        stroke-width="6" 
        stroke-dasharray="16 12"
        stroke-linecap="round"
        opacity="0.3"
  />

  <!-- Velocity Vector Speed Lines -->
  <path d="M 80 256 L 160 256" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 100 220 L 150 220" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 100 292 L 150 292" stroke="#ef4444" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Energy Speed Bolt in Center -->
  <g transform="translate(210, 176) scale(1.6)" filter="url(#glow)">
    <path d="M 45 10 
             L 10 70 
             L 35 70 
             L 20 120 
             L 60 55 
             L 35 55 
             Z" 
          fill="url(#boltGrad)"
    />
  </g>

  <!-- Accent sparkles -->
  <circle cx="392" cy="160" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="120" cy="352" r="8" fill="#fbbf24" filter="url(#glow)"/>
</svg>
